name: Stage 2 - NSE Live Daily-Candle Trigger Scanner

on:
  schedule:
    # NSE Live Market Hours (Mon-Fri, IST = UTC + 5:30):
    # 09:15 IST -> 03:45 UTC (Opening Gap-and-Go check)
    - cron: "45 3 * * 1-5"
    # 09:30 IST to 15:15 IST -> 04:00 to 09:45 UTC every 15 minutes
    - cron: "*/15 4-9 * * 1-5"
    # 15:30 IST -> 10:00 UTC (Closing bell check)
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even when NSE market is closed"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (do not send Telegram alerts)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nse-scanner-state
  cancel-in-progress: false

jobs:
  live-trigger-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage-2 Live Daily-Candle Trigger Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.run_live_scan $ARGS

      - name: Commit deduplication alert ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent_alerts.json
          if git diff --staged --quiet; then
            echo "No alert ledger changes to commit."
          else
            git commit -m "chore(live): update daily sent alerts ledger [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
