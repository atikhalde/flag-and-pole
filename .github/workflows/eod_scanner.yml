name: Stage 1 - NSE Daily EOD Coiled Scanner (<=20d Flag)

on:
  schedule:
    # 15:45 IST (Mon-Fri) = 10:15 UTC (15 mins after NSE market close)
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even on weekends or NSE holidays"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (do not send Telegram alerts)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nse-scanner-state
  cancel-in-progress: false

jobs:
  eod-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage-1 Full NSE Daily Pattern Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.run_eod_scan $ARGS

      - name: Upload generated Daily Charts as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eod-daily-charts-${{ github.run_number }}
          path: output/charts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated coiled watchlist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/coiled_candidates.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(eod): update coiled <=20d watchlist [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
