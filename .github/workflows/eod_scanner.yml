name: Stage 1 - NSE Daily EOD Flag Scanner

on:
  schedule:
    # 15:47 IST (Mon-Fri) = 10:17 UTC — ~17 min after the NSE close so the day's
    # final 1d bar is settled. Deliberately off the :00/:15/:30/:45 boundaries,
    # which are GitHub's busiest scheduler slots and suffer the worst delays.
    # See README "Scheduling reliability".
    - cron: '17 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eod-flag-scan
  cancel-in-progress: false

jobs:
  eod-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide whether an EOD scan is needed
        # An external scheduler can dispatch Stage-1 far more often than an EOD
        # scan needs (it was firing every 15 minutes). Re-scanning ~2,400 symbols
        # and re-sending notices many times a day is pure waste and noise, so a
        # completed EOD close is scanned once per trading session.
        #   - cron runs are always allowed (guarantees the settled close is taken)
        #   - manual runs are gated unless STAGE1_ONCE_PER_SESSION is set to false
        id: gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Scheduled run — proceeding (post-close scan always allowed)."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m src.skip_scan --check state/coiled_candidates.json

      - name: Run Stage-1 Full NSE Daily Flag Scan
        if: ${{ steps.gate.outputs.needed == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          PYTHONPATH: ${{ github.workspace }}
          STAGE1_ONCE_PER_SESSION: ${{ vars.STAGE1_ONCE_PER_SESSION || 'true' }}
        run: |
          mkdir -p output
          SUMMARY="output/scan_summary.json"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m src.run_eod_scan --force --summary-out "$SUMMARY"
          else
            python -m src.run_eod_scan --summary-out "$SUMMARY"
          fi

      - name: Verify scan state
        # The scanner exits 0 after a data-abort so the commit step can still run
        # and preserve state. This turns that soft abort into a visible red run.
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.check_state --summary output/scan_summary.json --path state/coiled_candidates.json

      - name: Upload generated Daily Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eod-daily-charts-${{ github.run_id }}
          path: output/charts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated coiled watchlist & alert ledger
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/gh_state_out
          [ -f state/coiled_candidates.json ] && cp state/coiled_candidates.json /tmp/gh_state_out/coiled_candidates.json
          [ -f state/sent_alerts.json ] && cp state/sent_alerts.json /tmp/gh_state_out/sent_alerts.json

          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            mkdir -p state
            if [ -f /tmp/gh_state_out/coiled_candidates.json ]; then
              cp /tmp/gh_state_out/coiled_candidates.json state/coiled_candidates.json
            fi
            if [ -f /tmp/gh_state_out/sent_alerts.json ]; then
              python -m src.alert_ledger --merge-into state/sent_alerts.json --from /tmp/gh_state_out/sent_alerts.json
            fi
            # `git add` exits 128 if a pathspec is missing, which killed this
            # step (and failed the run) whenever a state file did not exist yet.
            git add -A state/
            if git diff --staged --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "chore(eod): update coiled watchlist & sent alerts ledger [skip ci]"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "State synced cleanly on attempt $attempt."
              exit 0
            fi
            echo "Push race detected on attempt $attempt; retrying with fresh remote state..."
            sleep 3
          done
          echo "Failed to push state after 3 attempts."
          exit 1
