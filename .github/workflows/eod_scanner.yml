name: Stage 1 - NSE Daily EOD Flag Scanner

on:
  schedule:
    # 15:45 IST (Mon-Fri) = 10:15 UTC (15 mins after NSE market close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eod-flag-scan
  cancel-in-progress: false

jobs:
  eod-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage-1 Full NSE Daily Flag Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m src.run_eod_scan --force
          else
            python -m src.run_eod_scan
          fi

      - name: Upload generated Daily Charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eod-daily-charts-${{ github.run_id }}
          path: output/charts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated coiled watchlist & alert ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/coiled_candidates.json state/sent_alerts.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(eod): update coiled watchlist & sent alerts ledger [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
