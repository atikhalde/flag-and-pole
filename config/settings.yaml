# ==============================================================================
# NSE Daily High-Tight Flag / Coiled Pre-Breakout Scanner Configuration (V2.1)
# Pure Daily Timeframe (1d) — V2.1 Core + Coil (5-Year Full-NSE 2,381-Trade Edge)
# Full pattern (Breakout Pole + Tight Shelf Consolidation) strictly <= 20 days
# ==============================================================================

universe:
  # Auto-fetch official NSE EQUITY_L.csv; graceful fallback to bundled data/nse_universe.csv
  nse_equity_csv_url: "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv"
  fallback_csv_path: "data/nse_universe.csv"
  custom_watchlist_path: "config/custom_watchlist.txt"
  min_price: 50.0                 # INR minimum close price
  max_price: 25000.0              # INR maximum close price
  min_pole_value_cr: 2.0          # Min INR Crores traded on peak pole breakout day
  min_history_days: 50            # Minimum daily candles required (uses exact 150/200 SMA when available)

fetcher:
  daily_period: "15mo"            # ~310 trading days so 150/200 SMA & 52-week High are 100% exact
  batch_size: 100                 # yfinance batch download size
  batch_sleep_sec: 1.0            # Polite delay between batches to avoid Yahoo throttling
  max_retries: 2
  repair_nan_today_with_15m: true # Fixes Yahoo NSE quirk where today's 1d OHLC can briefly show NaN
  # --- Data-integrity circuit breaker -------------------------------------
  # A Yahoo/NSE outage or throttled run used to overwrite a good
  # coiled_candidates.json with an empty watchlist and commit it, silently
  # killing Stage-2 monitoring until the next good scan. Abort instead.
  min_fetch_success_pct: 50.0     # Abort (non-zero exit, state untouched) below this % of symbols fetched
  min_fetched_symbols: 100        # Absolute floor; ignored when --limit is used for tiny test runs
  min_backtest_universe: 30       # Stage-3 floor; explicit --symbols / tiny --limit runs are exempt

regime:
  # V2.1 Dual Market Regime Guard (NIFTY 50 Momentum + Live NSE Market Breadth)
  benchmark_ticker: "^NSEI"       # NIFTY 50 Daily benchmark
  enable_nifty_guard: true        # Layer 1: Pause during sharp NIFTY sell-offs
  min_nifty_20d_return_pct: -3.0  # Require NIFTY 50 20-day return >= -3.0%
  enable_breadth_guard: true      # Layer 2: Pause during broad NSE mid/small-cap bear phases (<40% PF 0.89)
  min_nse_breadth50_pct: 40.0     # Min % of liquid NSE stocks trading above their 50-day SMA (0 extra API calls)
  min_breadth_universe: 30        # Enforce cross-sectional breadth guard only when >= 30 stocks are loaded

pattern:
  # STRICT 20-DAY PATTERN WINDOW from first breakout (pole start) to today
  max_total_pattern_days: 20      # pole_days + base_days <= 20 trading sessions!
  min_pole_days: 1                # Pole (first breakout impulse) length: 1 to 3 days
  max_pole_days: 3
  min_base_days: 3                # Min tight consolidation days after pole

  # V2.1 Core + Coil Institutional Edge Gates (Validated Strictly IS 2022-24 & Blind OOS 2025-26)
  require_above_150sma: true      # Gate 1: Stage-2 medium-term trend (below 150 SMA = 0.80 OOS PF)
  require_above_200sma: true      # Gate 2: Primary uptrend only (below 200 SMA = 0.90 OOS PF)
  require_sma50_rising: true      # Gate 3: Rising 50-day SMA (falling 50 SMA = 0.84 OOS PF)
  sma50_slope_lookback: 10        # Compare SMA50[t] > SMA50[t - 10]
  min_rs63_vs_nifty_pct: 15.0     # Gate 4: 3-Month RS Leader vs NIFTY 50 (<0% = 0.67 OOS PF)
  max_pct_below_52w_high: 15.0    # Gate 5: Within 15% of 52-week High (upgraded from 25% -> eliminates overhead supply)
  min_pole_high_gain_pct: 18.0    # Gate 6a: Real institutional thrust pole (>= 18%)
  max_pole_high_gain_pct: 42.0    # Gate 6b: Anti-blowoff pole cap (passes leaders like BOROLTD 39.9%)
  min_base_wick_box_pct: 5.5      # Gate 7: Anti-micro-box floor (<5.5% tight box = 0.56 OOS PF stop-hunt magnet!)
  min_upper_pole_hold: 0.65       # Gate 8: True High-Tight Flag — every base close holds upper 35% of pole
  min_signal_pos_in_box: 0.20     # Gate 9: Upper-Flag Coil — blocks bottom-20% falling knives
  soft_climax_rvol_cap: 60.0      # Soft -8.5 pt penalty in Pillar 1 for >60x climax volume (keeps elite BOROLTD eligible)

  # Breakout Pole Strength Criteria
  min_pole_close_gain_pct: 12.0   # Pre-pole close -> pole end close gain (%)
  min_pole_rvol: 3.0              # Peak pole volume vs prior 20-day median volume
  require_breakout_over_20d_high: true  # First breakout must clear prior 20d resistance high

  # High-Tight Flag / Shelf Geometry Criteria
  max_base_close_spread_pct: 9.0  # Max closing tightness (max_close - min_close) / min_close (%)
  max_base_wick_box_pct: 15.0     # Max total shelf height (shelf_high - shelf_low) / shelf_low (%)
  max_already_broken_out_pct: 1.8 # Must NOT have already broken out >1.8% above shelf ceiling

  # Volatility Contraction & Volume Dry-Up Criteria
  max_recent_avg_range_pct: 5.5   # Last 3 sessions avg daily range (H-L)/C <= 5.5%
  max_dryup_ratio: 0.30           # Recent 3-4d avg vol <= 30% of peak pole vol (>=70% dry-up)
  max_base_to_pole_vol_ratio: 0.65 # Total base volume <= 65% of total pole volume

  # Daily Volume Profile (visual chart context & spring support confluence)
  vp_bins: 32                     # Visible-range Daily Volume Profile bins
  value_area_pct: 0.70            # 70% Value Area (VAH / VAL)

scoring:
  # V2.1 Core + Coil 5-Pillar Institutional Score (0-100)
  # Strict A+ > A monotonicity proven on 2,381 unbiased 5Y trades:
  #   Grade A+ (>= 78): 71.3% WR | 75.4% TP1 | 2.29 Gross PF (3.33 OOS PF) | 2.11 Net PF
  #   Grade A  (66-77.9): 66.1% WR | 69.6% TP1 | 1.34 Gross PF (1.41 OOS PF) [includes BOROLTD 73.5]
  #   All >= 66 (A & A+): 70.5% WR | 74.6% TP1 | 2.15 Gross PF (2.88 OOS PF) | 1.97 Net PF
  min_watchlist_score: 66         # Min score (0-100) to store Grade A/A+ in state/coiled_candidates.json
  min_eod_alert_score: 66         # Min score (0-100) for EOD Telegram Alerts (Grade A & A+ V2.1 Core+Coil)
  max_eod_chart_alerts: 15        # Send annotated Daily Chart Pattern PNG for every alerted setup
  max_watchlist_size: 40          # Max coiled stocks monitored by Stage-2 Live Scanner

trade_plan:
  # Entry strictly BELOW breakout level inside coiled flag shelf (proven superior to breakout chasing)
  entry_below_bo_min_pct: 0.8     # Primary Entry capped at least 0.8% BELOW breakout level (shelf_high)
  entry_flag_low_frac: 0.15       # Entry zone floor = 15% up from flag low
  entry_flag_high_frac: 0.72      # Entry zone ceiling = min(72% up flag box, 0.8% below BO)

  # Option A Stop-Loss: Daily-Close SL (3:20 PM IST) + Hard Emergency Broker GTT (-9%)
  # Supported modes: "daily_close" (Option A - Recommended) | "intraday_gtt" (Option B) | "strict_05" (Option C)
  sl_mode: "daily_close"
  sl_buffer_pct: 1.5              # Daily-Close SL buffer below flag low (1.5%)
  sl_min_risk_pct: 4.0            # Minimum breathing room below Entry (prevents tight-flag stop-hunts)
  sl_max_risk_pct: 6.5            # Hard cap on normal closing SL risk below Entry
  hard_gtt_stop_pct: 9.0          # Catastrophic intraday broker GTT stop (placed immediately on Entry)
  intraday_gtt_ref_buffer_pct: 2.5 # Reference 100% hands-off Intraday GTT SL (-2.5% below flag low, 4.5-6.5% risk)
  intraday_gtt_ref_min_risk_pct: 4.5
  intraday_gtt_ref_max_risk_pct: 6.5

  # High-Win-Rate 3-Tranche Profit Booking (+4.5% / +10.0% / +18.0% | 45/30/25 weights)
  tp1_pct_target: 4.5             # TP1 (+4.5% above Entry) -> Book 45%, move SL to Breakeven
  tp2_pct_target: 10.0            # TP2 (+10.0% above Entry) -> Book 30%, trail SL up to TP1
  tp3_pct_target: 18.0            # TP3 (+18.0% above Entry) -> Ride final 25% runner
  tp1_weight: 0.45                # Tranche weights (sum to 1.00)
  tp2_weight: 0.30
  tp3_weight: 0.25
  round_trip_cost_pct: 0.25       # Realistic NSE STT + brokerage + slippage benchmark for backtest reports
  round_to_nse_tick: true         # Round Entry / SL / TP levels cleanly to ₹0.05 NSE tick size

live_triggers:
  # Stage-2 Live Market Scanner evaluating TODAY's forming Daily Candle
  gap_and_go_min_gap_pct: 1.2     # Opens >= 1.2% above prev close near/above shelf ceiling
  breakout_buffer_pct: 0.3        # Live price >= shelf_high * 1.003
  breakout_min_rvol: 1.8          # Time-adjusted Daily RVOL vs recent base avg volume
  breakout_min_clv: 0.55          # Live daily close sits in upper 45% of today's range
  spring_sweep_buffer_pct: 0.7    # Today's low pokes within 0.7% of / below shelf floor
  spring_min_clv: 0.55            # Snaps back into upper half of daily candle & green
  coil_max_dist_to_ceiling_pct: 2.5 # Within 2.5% of shelf ceiling on ultra-tight inside bar
  min_minutes_after_open_for_rvol: 15

telegram:
  enabled: true
  send_charts: true
  send_eod_summary_even_if_empty: false   # Stay silent when 0 brand-new unalerted stocks exist
  # A paused guard or an aborted run used to look identical to "no setups found"
  # because every run still went green with no output. Now the scanner announces
  # the pause explicitly (and marks the GitHub job summary) so silence is never ambiguous.
  notify_on_guard_pause: true             # Send a Telegram line when a regime/breadth guard pauses the scan
  tradingview_url_template: "https://www.tradingview.com/chart/?symbol=NSE%3A{symbol}"

deduplication:
  # Symbol-level repeat-alert policy.
  #   strict_never_repeat_symbol: true  + repeat_cooldown_days: 20  -> "cooldown" (DEFAULT)
  #   strict_never_repeat_symbol: true  + repeat_cooldown_days: 0   -> "lifetime" (legacy, once ever)
  #   strict_never_repeat_symbol: false                             -> "per_trigger" (per symbol+trigger)
  #
  # NOTE: "lifetime" is what previously left Stage-2 permanently muted — BOROLTD
  # alerted on 2026-11-17 and was then skipped on every subsequent run forever.
  # "cooldown" keeps the anti-spam intent while letting a genuinely new setup
  # re-qualify once 20 trading-session-days have elapsed.
  strict_never_repeat_symbol: true
  repeat_cooldown_days: 20                # Suppress repeats for this many calendar days
